name: Publish Package

# This workflow uses npm Trusted Publishers with OIDC authentication.
# No NPM_TOKEN secret is required - authentication is handled via GitHub's OIDC provider.
#
# Prerequisites:
#   1. Configure trusted publisher on npmjs.com:
#      - Go to package settings → Trusted Publishers
#      - Select "GitHub Actions"
#      - Set: owner=HMB-research, repo=x-ray-crawler, workflow=publish.yml
#   2. Ensure this workflow file name matches the trusted publisher configuration

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'NPM dist-tag (latest, beta, alpha, next)'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - alpha
          - next

permissions:
  contents: read
  id-token: write  # Required for npm OIDC trusted publishing

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.js 22.x includes npm 11.5+ which is required for OIDC trusted publishing
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build package
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "No build script found, skipping..."
          fi
        continue-on-error: true

      # OIDC trusted publishing: No NODE_AUTH_TOKEN needed
      # npm automatically uses OIDC when:
      #   1. id-token: write permission is granted
      #   2. registry-url is configured in setup-node
      #   3. NODE_AUTH_TOKEN is NOT set (crucial - even empty string breaks OIDC)
      #   4. Trusted publisher is configured on npmjs.com
      # Provenance is automatically included with trusted publishing
      - name: Publish to NPM (latest)
        if: github.event_name == 'release' || github.event.inputs.npm_tag == 'latest'
        run: npm publish --provenance --access public

      - name: Publish to NPM (tagged)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.npm_tag != 'latest'
        run: npm publish --provenance --access public --tag ${{ github.event.inputs.npm_tag }}

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Package published successfully!"
          echo "Version: $(node -p "require('./package.json').version")"
          echo "Tag: ${{ github.event.inputs.npm_tag || 'latest' }}"
