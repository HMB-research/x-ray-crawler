name: Release

# This workflow uses npm Trusted Publishers with OIDC authentication.
# No NPM_TOKEN secret is required - authentication is handled via GitHub's OIDC provider.
#
# Prerequisites:
#   1. Configure trusted publisher on npmjs.com:
#      - Go to package settings → Trusted Publishers
#      - Select "GitHub Actions"
#      - Set: owner=HMB-research, repo=x-ray-crawler, workflow=release.yml
#   2. Ensure this workflow file name matches the trusted publisher configuration

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write  # Required for npm OIDC trusted publishing

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      major: ${{ steps.semantic.outputs.new_release_major_version }}
      minor: ${{ steps.semantic.outputs.new_release_minor_version }}
      patch: ${{ steps.semantic.outputs.new_release_patch_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node.js 22.x includes npm 11.5+ which is required for OIDC trusted publishing
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      # OIDC trusted publishing: No NPM_TOKEN needed
      # semantic-release/npm plugin will use OIDC automatically when:
      #   1. id-token: write permission is granted
      #   2. registry-url is configured in setup-node
      #   3. NPM_TOKEN is NOT set
      #   4. Trusted publisher is configured on npmjs.com
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
          branches: |
            [
              'main',
              'master'
            ]
